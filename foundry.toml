[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Latest stable solc verified available at time of writing (2026-09).
solc_version = "0.8.37"
auto_detect_solc = false

# Arc Testnet targets the Osaka hard fork as its EVM baseline
# (docs.arc.io/arc/references/evm-differences). Targeting Osaka keeps
# generated bytecode within what Arc executes.
evm_version = "osaka"

optimizer = true
optimizer_runs = 200
via_ir = false

ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
# Resolved from $ARC_TESTNET_RPC_URL, e.g. https://rpc.testnet.arc.io
arc_testnet = "${ARC_TESTNET_RPC_URL}"
local = "http://127.0.0.1:8545"
